name: Phase 5B Blocker Fix

on:
  push:
    branches:
      - feature/central-write-cutover-phase5b

permissions:
  contents: write

env:
  VITE_FIREBASE_API_KEY: dummy-api-key
  VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: dummy-project
  VITE_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
  VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
  VITE_FIREBASE_APP_ID: '1:123456789:web:dummy'

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/central-write-cutover-phase5b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply exact blocker fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/lib/__tests__/goldPricingAssistant.test.ts',
              '''    expect(entryFormSource).toContain('renderStep3');\n    expect(entryFormSource).toContain("addDoc(collection(db, 'entries')");''',
              '''    expect(entryFormSource).toContain('renderStep3');\n    expect(entryFormSource).toContain('createCentralAccountingEntry');\n    expect(entryFormSource).not.toContain("addDoc(collection(db, 'entries')");'''
          )

          replace_once(
              'src/components/views/__tests__/EntryFormCompletionActions.test.ts',
              '''  it('places invoice accounting fields on the entry before save-time policy validation', () => {\n    const source = readFileSync(new URL('../EntryForm.tsx', import.meta.url), 'utf8');\n    const entryFields = source.indexOf('marketPrice: formData.marketPrice');\n    const policyValidation = source.indexOf('validateAccountingPolicy(entry, accountsDb)');\n\n    expect(entryFields).toBeGreaterThanOrEqual(0);\n    expect(source.indexOf('karat: formData.karat ?? undefined')).toBeGreaterThanOrEqual(0);\n    expect(entryFields).toBeLessThan(policyValidation);\n    expect(source).not.toContain('if (formData.karat) entry.karat = formData.karat;');\n    expect(source).not.toContain('if (formData.marketPrice !== undefined) entry.marketPrice = formData.marketPrice;');\n  });''',
              '''  it('places invoice accounting fields on the entry before Central save validation', () => {\n    const source = readFileSync(new URL('../EntryForm.tsx', import.meta.url), 'utf8');\n    const entryFields = source.indexOf('marketPrice: formData.marketPrice');\n    const centralSave = source.indexOf('createCentralAccountingEntry({');\n\n    expect(entryFields).toBeGreaterThanOrEqual(0);\n    expect(source.indexOf('karat: formData.karat ?? undefined')).toBeGreaterThanOrEqual(0);\n    expect(centralSave).toBeGreaterThan(entryFields);\n    expect(source).not.toContain('validateAccountingPolicy(entry, accountsDb)');\n    expect(source).not.toContain('if (formData.karat) entry.karat = formData.karat;');\n    expect(source).not.toContain('if (formData.marketPrice !== undefined) entry.marketPrice = formData.marketPrice;');\n  });'''
          )

          p = Path('src/lib/__tests__/centralAccountingWriteCutover.test.ts')
          text = p.read_text()
          old = "import { buildInventoryAdjustmentDraftEntry } from '../inventoryCheckSettlement';"
          new = old + "\nimport { sameCentralOperationPayload } from '../centralAccountingWriteService';"
          if text.count(old) != 1:
              raise SystemExit('centralAccountingWriteCutover import marker mismatch')
          text = text.replace(old, new, 1)
          marker = "  it('removes hard-delete controls from the saved Entry correction UI', () => {"
          regression = '''  it('fails same-ID idempotency comparison when either stable account ID changes', () => {\n    const base = {\n      id: 'op-stable', seq: 1, tx: 'بيع ذهب', debit: 'الخزنة', credit: 'خاتم عربي',\n      debitAccountId: 'cash-1', creditAccountId: 'gold-1', date: '2026-09-01', cash: '1000',\n      weight: '1', count: '0', arabicWeight: '1', invoiceNumber: 'S1', userId: 'u',\n    } as Entry;\n    expect(sameCentralOperationPayload(base, { ...base })).toBe(true);\n    expect(sameCentralOperationPayload(base, { ...base, debitAccountId: 'cash-2' })).toBe(false);\n    expect(sameCentralOperationPayload(base, { ...base, creditAccountId: 'gold-2' })).toBe(false);\n  });\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('centralAccountingWriteCutover test marker mismatch')
          p.write_text(text.replace(marker, regression + marker, 1))
          PY

          cat > src/lib/__tests__/centralAccountingWriteArchitecture.test.ts <<'EOF'
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { dirname, relative, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { describe, expect, it } from 'vitest';

          const currentDir = dirname(fileURLToPath(import.meta.url));
          const srcRoot = resolve(currentDir, '../..');
          const allowedWriter = 'lib/centralAccountingWriteService.ts';

          const sourceFiles = (): string[] => {
            const files: string[] = [];
            const walk = (dir: string) => {
              for (const name of readdirSync(dir)) {
                const full = resolve(dir, name);
                const stat = statSync(full);
                if (stat.isDirectory()) {
                  if (name === '__tests__' || name === 'test-fixtures') continue;
                  walk(full);
                  continue;
                }
                if (!/\.(ts|tsx)$/.test(name) || /\.test\.(ts|tsx)$/.test(name)) continue;
                files.push(full);
              }
            };
            walk(srcRoot);
            return files;
          };

          const escapedRegex = (value: string): string => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

          const entryCollectionRefNames = (source: string): string[] => {
            const names = new Set<string>();
            const pattern = /(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*collection\s*\(\s*db\s*,\s*['"]entries['"]\s*\)/g;
            for (const match of source.matchAll(pattern)) names.add(match[1]);
            return [...names];
          };

          const entryDocumentRefNames = (source: string): string[] => {
            const names = new Set<string>();
            const patterns = [
              /(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*doc\s*\(\s*db\s*,\s*['"]entries['"]/g,
              /(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*doc\s*\(\s*collection\([^\n)]*['"]entries['"][^)]*\)\s*\)/g,
            ];
            for (const pattern of patterns) {
              for (const match of source.matchAll(pattern)) names.add(match[1]);
            }
            for (const collectionName of entryCollectionRefNames(source)) {
              const collectionRef = escapedRegex(collectionName);
              const pattern = new RegExp(`(?:const|let|var)\\s+([A-Za-z_$][\\w$]*)\\s*=\\s*doc\\s*\\(\\s*${collectionRef}\\b`, 'g');
              for (const match of source.matchAll(pattern)) names.add(match[1]);
            }
            return [...names];
          };

          const writesThroughEntryRef = (source: string, methods: string): boolean => (
            entryDocumentRefNames(source).some(refName => {
              const ref = escapedRegex(refName);
              return new RegExp(`(?:setDoc|updateDoc|deleteDoc)\\s*\\(\\s*${ref}\\b`).test(source)
                || new RegExp(`[A-Za-z_$][\\w$]*\\.${methods}\\s*\\(\\s*${ref}\\b`).test(source);
            })
          );

          const directEntryWriterPatterns = [
            /addDoc\s*\(\s*collection\([^\n)]*['"]entries['"]/s,
            /setDoc\s*\(\s*doc\([^\n)]*['"]entries['"]/s,
            /updateDoc\s*\(\s*doc\([^\n)]*['"]entries['"]/s,
            /deleteDoc\s*\(\s*doc\([^\n)]*['"]entries['"]/s,
            /[A-Za-z_$][\w$]*\.(?:delete|update|set)\s*\(\s*doc\([^\n)]*['"]entries['"]/s,
            /doc\s*\(\s*collection\([^\n)]*['"]entries['"][\s\S]{0,2000}?[A-Za-z_$][\w$]*\.(?:set|update|delete)\s*\(/s,
          ];

          const hasEntryWriter = (source: string): boolean => (
            directEntryWriterPatterns.some(pattern => pattern.test(source))
            || writesThroughEntryRef(source, '(?:set|update|delete)')
          );

          const hasEntryHardDelete = (source: string): boolean => (
            /deleteDoc\s*\(\s*doc\([^\n)]*['"]entries['"]/s.test(source)
            || /[A-Za-z_$][\w$]*\.delete\s*\(\s*doc\([^\n)]*['"]entries['"]/s.test(source)
            || writesThroughEntryRef(source, 'delete')
          );

          describe('Central Accounting write architecture guard', () => {
            it('has no runtime accounting Entry writer outside the Central write service', () => {
              const bypasses = sourceFiles()
                .map(full => ({ path: relative(srcRoot, full).replaceAll('\\', '/'), source: readFileSync(full, 'utf8') }))
                .filter(file => file.path !== allowedWriter)
                .filter(file => hasEntryWriter(file.source))
                .map(file => file.path)
                .sort();
              expect(bypasses).toEqual([]);
            });

            it('does not expose a hard-delete path for accounting Entries', () => {
              const hardDeletes = sourceFiles()
                .map(full => ({ path: relative(srcRoot, full).replaceAll('\\', '/'), source: readFileSync(full, 'utf8') }))
                .filter(file => hasEntryHardDelete(file.source))
                .map(file => file.path)
                .sort();
              expect(hardDeletes).toEqual([]);
            });

            it('detects collection aliases and arbitrary transaction variable names', () => {
              expect(hasEntryWriter(`
                const entriesCol = collection(db, 'entries');
                const entryRef = doc(entriesCol, operationId);
                tx.set(entryRef, payload);
              `)).toBe(true);
              expect(hasEntryWriter(`
                const entriesCollection = collection(db, "entries");
                const ref = doc(entriesCollection, operationId);
                customTransaction.update(ref, payload);
              `)).toBe(true);
              expect(hasEntryHardDelete(`
                const entriesCol = collection(db, 'entries');
                const entryRef = doc(entriesCol, operationId);
                tx.delete(entryRef);
              `)).toBe(true);
            });
          });
          EOF

      - name: Focused blocker and Phase 5B tests
        run: >-
          npx vitest run
          src/lib/__tests__/centralAccountingWritePreflight.test.ts
          src/lib/__tests__/centralAccountingWriteCutover.test.ts
          src/lib/__tests__/centralAccountingWriteArchitecture.test.ts
          src/lib/__tests__/centralAccountingRegistry.test.ts
          src/lib/__tests__/centralAccountingShadow.test.ts
          src/lib/__tests__/centralAccountingPipeline.regression.test.ts
          src/lib/__tests__/inventoryCheckSettlement.test.ts
          src/lib/__tests__/postingMatrix.test.ts
          src/lib/__tests__/costRecalculation.test.ts
          src/lib/__tests__/goldPricingAssistant.test.ts
          src/components/views/__tests__/EntryFormCompletionActions.test.ts
          src/components/views/__tests__/TrialBalanceView.test.ts
          src/components/views/__tests__/GeneralLedgerView.test.ts
          src/components/views/__tests__/FinancialStatementsCentralRuntime.test.ts
      - run: npm run typecheck
      - run: npm run check:balance-contract
      - run: npm run build
      - run: git diff --check origin/main...HEAD
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/__tests__/goldPricingAssistant.test.ts src/components/views/__tests__/EntryFormCompletionActions.test.ts src/lib/__tests__/centralAccountingWriteCutover.test.ts src/lib/__tests__/centralAccountingWriteArchitecture.test.ts
          git commit -m "test(phase5b): close independent acceptance blockers"
          git push origin HEAD:feature/central-write-cutover-phase5b
