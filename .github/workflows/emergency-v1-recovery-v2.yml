name: Emergency V1 Recovery Verification V2

on:
  push:
    branches:
      - hotfix/v1-central-registry-recovery-2026-09-10

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ci-only-not-production
      VITE_FIREBASE_AUTH_DOMAIN: ci.invalid
      VITE_FIREBASE_PROJECT_ID: makka-ci-only
      VITE_FIREBASE_STORAGE_BUCKET: makka-ci-only.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_APP_ID: '1:000000000000:web:ci-only'
    steps:
      - name: Checkout isolated production base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply only the already-reviewed PR33 price-capture diff onto the safe V1 production base
        shell: bash
        run: |
          git checkout origin/fix/v1-al-safi-transfer-price-2026-09-10 -- \
            src/lib/merchantTransferInvoicePricing.ts \
            src/lib/__tests__/merchantTransferInvoicePricing.test.ts
          git diff 6250e18c94ae55d324acfb4c22cbee2c61dcbb3d 993f1b78309399bda7b99f62e886c9bed8be3cf7 -- \
            src/components/views/EntryForm.tsx > /tmp/entry-price.patch
          git apply --3way /tmp/entry-price.patch

      - name: Prove isolated scope and safe save path
        shell: bash
        run: |
          git diff --check
          ! grep -q "centralAccountingWriteService" src/components/views/EntryForm.tsx
          test "$(git diff --name-only HEAD | grep '^src/' | sort)" = "$(printf '%s\n' \
            src/components/views/EntryForm.tsx \
            src/lib/__tests__/merchantTransferInvoicePricing.test.ts \
            src/lib/merchantTransferInvoicePricing.ts | sort)"

      - name: Install dependencies
        run: npm ci

      - name: Focused regression suite
        run: >-
          npx vitest run
          src/lib/__tests__/merchantTransferInvoicePricing.test.ts
          src/lib/__tests__/accountingPolicy.test.ts
          src/lib/__tests__/alSafiTransferAccounting.regression.test.ts
          src/lib/__tests__/merchantGoldLiabilityWac.regression.test.ts
          src/components/views/__tests__/EntryFormCompletionActions.test.ts
          src/lib/__tests__/entryValidation.test.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Balance Contract
        run: npm run check:balance-contract

      - name: Production build
        run: npm run build

      - name: Commit verified hotfix and remove temporary CI workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/emergency-v1-recovery.yml .github/workflows/emergency-v1-recovery-v2.yml
          git add src/components/views/EntryForm.tsx src/lib/merchantTransferInvoicePricing.ts src/lib/__tests__/merchantTransferInvoicePricing.test.ts
          git diff --cached --check
          changed="$(git diff --cached --name-only | grep '^src/' | sort)"
          expected="$(printf '%s\n' src/components/views/EntryForm.tsx src/lib/__tests__/merchantTransferInvoicePricing.test.ts src/lib/merchantTransferInvoicePricing.ts | sort)"
          test "$changed" = "$expected"
          git commit -m "fix: restore safe V1 save path with Al-Safi Hawala pricing"
          git push origin HEAD:${GITHUB_REF_NAME}
