name: Firebase Auth Probe

on:
  push:
    branches:
      - deploy/v1-safe-production-recovery-2026-09-10

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report credential presence only
        env:
          FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_VALUE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAKKA_CENTRAL_ACCOUNTING }}
          VITE_API_KEY_VALUE: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_AUTH_DOMAIN_VALUE: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_PROJECT_ID_VALUE: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_STORAGE_BUCKET_VALUE: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_SENDER_ID_VALUE: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_APP_ID_VALUE: ${{ secrets.VITE_FIREBASE_APP_ID }}
        shell: bash
        run: |
          bool() { if [ -n "$1" ]; then echo yes; else echo no; fi; }
          echo "firebase_token=$(bool "$FIREBASE_TOKEN_VALUE")"
          echo "firebase_service_account=$(bool "$FIREBASE_SERVICE_ACCOUNT_VALUE")"
          echo "vite_api_key=$(bool "$VITE_API_KEY_VALUE")"
          echo "vite_auth_domain=$(bool "$VITE_AUTH_DOMAIN_VALUE")"
          echo "vite_project_id=$(bool "$VITE_PROJECT_ID_VALUE")"
          echo "vite_storage_bucket=$(bool "$VITE_STORAGE_BUCKET_VALUE")"
          echo "vite_sender_id=$(bool "$VITE_SENDER_ID_VALUE")"
          echo "vite_app_id=$(bool "$VITE_APP_ID_VALUE")"
